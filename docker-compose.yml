services:
  wallet-risk-api:
    image: ${WALLET_RISK_IMAGE:-wallet-risk-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8000"
    volumes:
      - ./models:/app/models
      - ./data/corpus:/app/data/corpus
      - ./data/vector_index:/app/data/vector_index
      - ./monitoring/explanations:/app/monitoring/explanations
      - ./monitoring/logs:/app/monitoring/logs
      - ./mlruns:/app/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
