[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".git",
  ".matplotlib",
  "mlruns",
  "project_review",
]

[tool.ruff.lint]
select = [
  "E9",
  "F63",
  "F7",
  "F82",
  "F821",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
